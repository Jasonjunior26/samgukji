<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전투 v4 화면 시험</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<!-- 사용: chrome --headless --allow-file-access-from-files --screenshot ... "file:///.../tools/shot_harness.html?s=장면이름&siege=0&terr=0&m=6"
     게임(samguk_v105.html)을 iframe으로 열고, 아래 장면 함수로 전투 v4 시험 화면을 조작한다. 게임 파일은 고치지 않음. -->
<iframe id="g" src="../samguk_v105.html"></iframe>
<script>
const Q = new URLSearchParams(location.search);
const sl = ms => new Promise(r => setTimeout(r, ms));
const SCN = {
  // 처음 화면: 아군 부대 하나 고르기
  sel: async (w) => { const W = w.V4.W; const u = W.units.find(u => u.side === 'A' && !u.acted); w.V4UI.tap(u.x, u.y); },
  // 가까이 붙인 뒤 이동 → 행동 메뉴 / 예상 창 / 공격 연출
  menu: async (w) => { await near(w); },
  fore: async (w) => { const t = await near(w); if (!t) return; w.ACT.v4cAtk(); await sl(200); w.V4UI.tap(t.x, t.y); },
  go: async (w) => { const t = await near(w); if (!t) return; w.ACT.v4cAtk(); await sl(200); w.V4UI.tap(t.x, t.y); await sl(200); w.ACT.v4cGo(); },
  enemy: async (w) => { const t = await near(w); if (!t) return; w.ACT.v4cWait(); w.V4.W.units.forEach(u => { if (u.side === 'A') u.acted = true; }); w.V4UI.endTurn(); },
  spell: async (w) => { const t = await near(w, true); if (!t) return; w.ACT.v4cSp(); },
  duel: async (w) => { const t = await near(w); if (!t) return; if (w.V4.duelTargets(w.V4UI.ui.sel != null ? w.V4.W.units.find(u => u.id === w.V4UI.ui.sel) : null).length) w.ACT.v4cDuel(); },
};
// 핵심만 몇 턴 돌려 양쪽을 붙이고, 칠 수 있는 아군을 그 칸으로 움직임
async function near(w, wantSpell) {
  const V4 = w.V4, W = V4.W;
  for (let k = 0; k < 14 && !W.over; k++) { const ok = W.units.some(u => u.alive && u.side === 'A' && V4.reach(u).some(c => V4.targets(u, c.x, c.y).length)); if (W.phase === 'A' && ok) break; V4.runPhaseAI(W.phase, true); V4.endPhase(); }
  W.units.forEach(u => { if (u.side === 'A') { u.acted = false; u.moved = false; } });
  w.V4UI.ui.evi = W.ev.length; w.V4UI.ui.busy = false; w.V4UI.panel();
  const cand = W.units.filter(u => u.alive && u.side === 'A' && (!wantSpell || V4.spellsOf(u).length));
  const u = cand.find(u => V4.reach(u).some(c => V4.targets(u, c.x, c.y).length)) || cand[0]; if (!u) return null;
  const c = V4.reach(u).find(c => V4.targets(u, c.x, c.y).length) || { x: u.x, y: u.y }; const t = V4.targets(u, c.x, c.y)[0];
  w.V4UI.focus(u.x, u.y, false); w.V4UI.tap(u.x, u.y); await sl(300); w.V4UI.tap(c.x, c.y); await sl(1200); w.V4UI.focus(c.x, c.y, false); return t;
}
document.getElementById('g').addEventListener('load', () => setTimeout(async () => {
  const g = document.getElementById('g').contentWindow;
  try {
    g.eval(`newGame('조조'); UI.scr = 'main'; S.m = ${+(Q.get('m') || 6)}; V4T.siege = ${Q.get('siege') === '1'}; V4T.i = ${+(Q.get('terr') || 0)}; v4TestOpen();`);
    // V4·V4UI·ACT는 const라 창 속성이 아님 → eval로 꺼냄
    const w = { V4: g.eval('V4'), V4UI: g.eval('V4UI'), ACT: g.eval('ACT') };
    await sl(+(Q.get('wait') || 2200));
    const f = SCN[Q.get('s') || 'sel']; if (f) await f(w);
  } catch (e) { document.body.insertAdjacentHTML('afterbegin', `<pre style="position:fixed;z-index:9;color:#f55;background:#000;white-space:pre-wrap">${e.stack}</pre>`); }
}, 200));
</script>
</body></html>
