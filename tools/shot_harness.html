<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전투 v4 화면 시험</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<!-- 사용: chrome --headless --allow-file-access-from-files --screenshot ... "file:///.../tools/shot_harness.html?s=장면이름&siege=0&terr=0&m=6"
     게임(samguk_v108.html)을 iframe으로 열고, 아래 장면 함수로 전투 v4 시험 화면을 조작한다. 게임 파일은 고치지 않음.
     실제 출진 흐름(8단계): ?s=real|realover|realdone|realret|realretdone (아래 REAL 참고) -->
<iframe id="g" src="../samguk_v108.html"></iframe>
<script>
const Q = new URLSearchParams(location.search);
const sl = ms => new Promise(r => setTimeout(r, ms));
const SCN = {
  // 군주 전용 그림 시험: 아군·적군 군주를 병종별로 두 줄 세운다. ?weak=1 은 병력 10%(웅크린 피격 칸), ?sel=1 은 첫 아군 선택·총대장 깃발, ?dir=n|w|e|s 방향
  lord: async (w, g) => { const V4 = w.V4, W = V4.W; const uq = g.eval('JOJO_UNITS.uniq'); const cls = ['보병', '기병', '궁병', '궁기병', '산악병', '책사', '방진', '보병'];
    for (const side of ['A', 'D']) { let us = W.units.filter(u => u.side === side && !uq[u.gen]); while (us.length && us.length < 8) { const c = Object.assign({}, us[0], { id: W.uid++, sts: {}, buf: { A: 3, D: 3, I: 3, E: 3, M: 3, V: 3 }, gen: us[us.length % us.length].gen }); W.units.push(c); us.push(c); } us = us.slice(0, 8); us.forEach((u, i) => { u.lord = true; u.cls = cls[i]; u.tier = i % 3; u.x = 4 + i; u.y = side === 'A' ? 3 : 5; u.dir = Q.get('dir') || (side === 'A' ? 'n' : 's'); u.alive = true; u.troops = Q.get('weak') ? Math.round(u.max * .1) : u.max; if (Q.get('sel') && side === 'A' && i === 0) { w.V4UI.ui.sel = u.id; W.hq.A = u.id; } }); document.title += ' ' + side + us.length; }
    W.units.filter(u => !u.lord).forEach(u => { u.x = 12; u.y = 12; });
    await sl(1500); w.V4UI.focus(+(Q.get('fx') || 7), 4, false); w.V4UI.kick(); await sl(600); w.V4UI.focus(+(Q.get('fx') || 7), 4, false); w.V4UI.kick(); await sl(300); },
  // 군주 그림 렌더 경로 시험: 모든 부대를 군주로 만들고 양쪽 AI를 여러 차례 돌리며 그린다. 오류는 id="errs" 에 모은다
  lordplay: async (w, g) => { const V4 = w.V4, W = V4.W; const cls = ['보병', '기병', '궁병', '궁기병', '산악병', '책사', '방진']; g.__errs = []; g.addEventListener('error', e => g.__errs.push(String(e.message)));
    W.units.forEach((u, i) => { if (u.cls !== '공성' && u.cls !== '수군') { u.lord = true; u.cls = cls[i % 7]; u.tier = i % 3; } });
    for (let k = 0; k < 12 && !W.over; k++) { try { V4.runPhaseAI(W.phase, true); w.V4UI.kick(); } catch (e) { g.__errs.push(e.stack); } await sl(250); }
    document.body.insertAdjacentHTML('beforeend', '<pre id="errs">ERRS=' + g.__errs.length + ' ' + g.__errs.slice(0, 3).join('|') + ' turn=' + W.turn + '</pre>'); },
  // 처음 화면: 아군 부대 하나 고르기
  sel: async (w) => { const W = w.V4.W; const u = W.units.find(u => u.side === 'A' && !u.acted); w.V4UI.tap(u.x, u.y); },
  // 가까이 붙인 뒤 이동 → 행동 메뉴 / 예상 창 / 공격 연출
  menu: async (w) => { await near(w); },
  fore: async (w) => { const t = await near(w); if (!t) return; w.ACT.v4cAtk(); await sl(200); w.V4UI.tap(t.x, t.y); },
  go: async (w) => { const t = await near(w); if (!t) return; w.ACT.v4cAtk(); await sl(200); w.V4UI.tap(t.x, t.y); await sl(200); w.ACT.v4cGo(); },
  enemy: async (w) => { const t = await near(w); if (!t) return; w.ACT.v4cWait(); w.V4.W.units.forEach(u => { if (u.side === 'A') u.acted = true; }); w.V4UI.endTurn(); },
  spell: async (w) => { const t = await near(w, true); if (!t) return; w.ACT.v4cSp(); },
  // 책략을 실제로 씀 (효과음 시험): 쓸 수 있는 첫 책략을 골라 사거리 안의 적(없으면 첫 칸)에 건다
  cast: async (w) => { const t = await near(w, true); if (!t) return; const V4 = w.V4, ui = w.V4UI.ui; const u = V4.W.units.find(x => x.id === ui.sel); if (!u) return; w.ACT.v4cSp(); await sl(150);
    const sp = V4.spellsOf(u).find(s => s.ok); if (!sp) return; w.ACT.v4cSpPick(sp.id); await sl(150);
    if (ui.mode === 'spellT') { const cells = ui.gold || []; const c = cells.find(c => V4.unitAt(c.x, c.y) && V4.canCast(u, sp.id, c.x, c.y)) || cells.find(c => V4.canCast(u, sp.id, c.x, c.y)); if (!c) return; w.V4UI.tap(c.x, c.y); await sl(150); }
    w.ACT.v4cCast(); await sl(2500); },
  duel: async (w) => { const t = await near(w); if (!t) return; if (w.V4.duelTargets(w.V4UI.ui.sel != null ? w.V4.W.units.find(u => u.id === w.V4UI.ui.sel) : null).length) w.ACT.v4cDuel(); },
  // 7단계 작전 회의: council = 회의 창 그대로 / plan = ?plan=야습 등을 골라 적용한 뒤 (개전 연출이 끝난) 첫 차례 화면. ?w=맑음 으로 날씨를 고정할 수 있다
  council: async () => { },
  // ?freeze=1: 화공 불길이 뜨는 순간을 잡는다 (불 효과가 보이면 효과 시간을 늘리고 연출 속도를 거의 멈춤)
  plan: async (w, g) => { const ui = w.V4UI.ui; const p = pickPlan(w, g, Q.get('plan') || '정공');
    if (Q.get('freeze')) { for (let i = 0; i < 200; i++) { await sl(50); if (ui.fxs.some(f => f.kind === 'fire')) { ui.fxs.forEach(f => f.dur = 1e7); ui.speed = 0.001; w.V4UI.kick(); break; } } }
    await p; await sl(+(Q.get('after') || 3500)); },
};
// 작전 회의 창이 떠 있으면 작전을 고른다 (다른 장면은 정공으로 넘어감)
async function pickPlan(w, g, id) { const d = document.getElementById('g').contentDocument; if (!d.getElementById('v4plan')) return false; w.ACT.v4Plan(id); await sl(300); return true; }
// 핵심만 몇 턴 돌려 양쪽을 붙이고, 칠 수 있는 아군을 그 칸으로 움직임
async function near(w, wantSpell) {
  const V4 = w.V4, W = V4.W;
  for (let k = 0; k < 14 && !W.over; k++) { const ok = W.units.some(u => u.alive && u.side === 'A' && V4.reach(u).some(c => V4.targets(u, c.x, c.y).length)); if (W.phase === 'A' && ok) break; V4.runPhaseAI(W.phase, true); V4.endPhase(); }
  W.units.forEach(u => { if (u.side === 'A') { u.acted = false; u.moved = false; } });
  w.V4UI.ui.evi = W.ev.length; w.V4UI.ui.busy = false; w.V4UI.panel();
  const cand = W.units.filter(u => u.alive && u.side === 'A' && (!wantSpell || V4.spellsOf(u).length));
  const u = cand.find(u => V4.reach(u).some(c => V4.targets(u, c.x, c.y).length)) || cand[0]; if (!u) return null;
  const c = V4.reach(u).find(c => V4.targets(u, c.x, c.y).length) || { x: u.x, y: u.y }; const t = V4.targets(u, c.x, c.y)[0];
  w.V4UI.focus(u.x, u.y, false); w.V4UI.tap(u.x, u.y); await sl(300); w.V4UI.tap(c.x, c.y); await sl(1200); w.V4UI.focus(c.x, c.y, false); return t;
}
// 8단계: 실제 출진 경로(옛 startBattle 래퍼 → enterBattle → V4) 시험. 조조가 초에서 진류를 친다
// real: 전투 화면(퇴각 단추) / realover: 적을 모두 쓰러뜨려 결과 단추 / realdone: 결과 단추를 눌러 결과 창 / realret: 퇴각 두 번 눌러 패배
const REAL = {
  real: async () => { },
  realover: async (w, g) => { g.eval(`V4.W.units.filter(u => u.side === 'D').forEach(u => { u.alive = false; u.troops = 0; }); V4.check();`); await w.V4UI.endTurn(); await sl(600); },
  realdone: async (w, g) => { await REAL.realover(w, g); w.ACT.v4Done(); await sl(600); },
  realret: async (w) => { w.ACT.v4Retreat(); await sl(300); w.ACT.v4Retreat(); await sl(800); },
  realretdone: async (w, g) => { await REAL.realret(w, g); w.ACT.v4Done(); await sl(600); },
};
// 확인용 상태 표시(화면 왼쪽 아래 작은 글씨, --dump-dom으로도 읽힘)
function status(g) {
  const s = g.eval(`JSON.stringify({ scr: UI.scr, owner: C('진류').owner, jinTroops: C('진류').troops, choTroops: C('초').troops, Bnull: typeof B === 'undefined' || B === null, over: V4.W && V4.W.over, why: V4.W && V4.W.why, sheet: UI.sheets.length ? UI.sheets[UI.sheets.length - 1].title : null, real: V4UI.ui.real, mode: V4UI.ui.mode,
    plan: V4.W && V4.W.plan, limit: V4.W && V4.W.limit, siege: V4.W && V4.W.siege, weather: V4.W && V4.W.weather, night: V4.W && V4.W.night, burn: V4.W && V4.W.units.filter(u => u.sts.burn).map(u => u.gen), ambush: V4.W && V4.W.units.filter(u => u.ambush).map(u => u.gen), log: V4.W && V4.W.log.filter(l => /작전/.test(l)) })`);
  document.body.insertAdjacentHTML('beforeend', `<pre id="st" style="position:fixed;left:0;bottom:0;z-index:9;margin:0;padding:2px 4px;color:#9f9;background:rgba(0,0,0,.7);font:10px monospace">${s}</pre>`);
}
// 효과음 기록(window.__sfxLog: JSND 가 남김)을 장면·파일·결과별로 세어 보여 준다 (id="sfx", --dump-dom 으로 읽음)
// 결과: play=틀었음 queued=풀어서 트는 중 html=HTMLAudio 로 틀었음 noctx=소리 장치 없음 off=효과음 꺼짐 skip4=4배속이라 건너뜀 gap=너무 잦아 건너뜀 nomap=대응표 없음 notv4=전투 화면 아님
function sfxStatus(g) {
  let log = [], bgm = {}; try { log = JSON.parse(g.eval('JSON.stringify(window.__sfxLog || [])')); bgm = JSON.parse(g.eval('JSON.stringify({ key: typeof JSND !== "undefined" ? JSND.bgmKey : null, hold: typeof JSND !== "undefined" && JSND.bgmHold, has: typeof JOJO_BGM !== "undefined" ? Object.keys(JOJO_BGM) : [], sfxClips: typeof JOJO_SFX !== "undefined" ? Object.keys(JOJO_SFX.clips).length : 0, ctx: !!(SND && SND.ctx), state: SND && SND.ctx ? SND.ctx.state : "", scene: SND && SND.scene, bgmOn: BGM.on, sfxOn: SND.sfxOn, speed: V4UI.ui.speed })')); } catch (e) { log = [{ s: 'err', r: String(e) }]; }
  const cnt = {}; log.forEach(e => { const k = e.bgm ? `bgm:${e.bgm}` : `${e.s}${e.loop ? '(loop)' : ''}`; const kk = `${k} ${e.c || ''} ${e.r || ''}`; cnt[kk] = (cnt[kk] || 0) + 1; });
  const s = JSON.stringify(bgm) + '\n' + Object.entries(cnt).map(([k, n]) => `${k} x${n}`).join('\n');
  document.body.insertAdjacentHTML('beforeend', `<pre id="sfx" style="position:fixed;right:0;top:0;z-index:9;margin:0;padding:2px 4px;color:#ff9;background:rgba(0,0,0,.7);font:10px monospace;max-height:100%;overflow:auto">${s}</pre>`);
}
document.getElementById('g').addEventListener('load', () => setTimeout(async () => {
  const g = document.getElementById('g').contentWindow;
  const scene = Q.get('s') || 'sel';
  try {
    // 날씨 고정(?w=맑음)과 군사 지력(?iq=80): 작전 회의 조건을 시험하기 위해 V4.start 결과를 손본다
    if (Q.get('w') || Q.get('iq')) g.eval(`{ const s0 = V4.start; V4.start = function () { const W = s0.apply(this, arguments); ${Q.get('w') ? `W.weather = '${Q.get('w')}'; W.wslot = { 맑음: 0, 흐림: 1 }['${Q.get('w')}'] ?? 2;` : ''} ${Q.get('iq') ? `const a = advisorOf(S.player); if (a) a.i = ${+Q.get('iq')};` : ''} return W; }; }`);
    // ?def=1: 장막이 진류에서 초를 쳐 플레이어(조조)가 수비측이 되는 실제 경로. 작전 회의의 지구전(공성)·매복(야전, ?terr=산악)을 시험한다
    if (REAL[scene] || Q.get('def')) g.eval(`newGame('조조'); UI.scr = 'main'; S.m = ${+(Q.get('m') || 6)}; UI.city = '초'; ${Q.get('terr') && Q.get('def') ? `C('초').terr = '${Q.get('terr')}';` : ''}
      const us = autoUnits(gensIn(${Q.get('def') ? `'진류', '장막'` : `'초', '조조'`}), 8000, 5); C('${Q.get('def') ? '진류' : '초'}').troops -= 8000; C('${Q.get('def') ? '진류' : '초'}').food -= 2000;
      startBattle(${Q.get('def') ? `'장막', '진류', '초'` : `'조조', '초', '진류'`}, us, 2000, '${Q.get('def') ? 'D' : 'A'}', '${Q.get('siege') === '0' ? '야전' : '농성'}'); UI.after = () => { UI.scr = 'main'; render(); }; enterBattle();`);
    else g.eval(`newGame('조조'); UI.scr = 'main'; S.m = ${+(Q.get('m') || 6)}; V4T.siege = ${Q.get('siege') === '1'}; V4T.i = ${+(Q.get('terr') || 0)}; v4TestOpen();`);
    // V4·V4UI·ACT는 const라 창 속성이 아님 → eval로 꺼냄
    const w = { V4: g.eval('V4'), V4UI: g.eval('V4UI'), ACT: g.eval('ACT') };
    // 효과음·BGM 시험: ?audio=1 이면 소리 장치를 미리 만들고(헤드리스는 --autoplay-policy=no-user-gesture-required 와 함께), ?spd=4 는 4배속, ?mute=1 은 효과음 끔, ?bgmoff=1 은 배경음악 끔
    if (Q.get('audio')) g.eval('try { sndInit(); } catch (e) { }');
    if (Q.get('spd')) w.V4UI.ui.speed = +Q.get('spd');
    if (Q.get('mute')) g.eval('SND.sfxOn = false');
    if (Q.get('bgmoff')) g.eval('BGM.setOn(false)');
    await sl(+(Q.get('wait') || 2200));
    // 7단계: 전투 앞에 작전 회의 창이 뜬다. council·plan 장면이 아니면 정공으로 넘기고 개전 연출을 기다린다
    if (scene !== 'council' && scene !== 'plan' && await pickPlan(w, g, '정공')) await sl(1800);
    const f = REAL[scene] || SCN[scene]; if (f) await f(w, g);
    if (REAL[scene] || scene === 'council' || scene === 'plan') status(g);
    if (Q.get('sfx') || ['go', 'enemy', 'spell', 'duel', 'realover', 'realret'].includes(scene)) { await sl(+(Q.get('sfxwait') || 1500)); sfxStatus(g); }
  } catch (e) { document.body.insertAdjacentHTML('afterbegin', `<pre style="position:fixed;z-index:9;color:#f55;background:#000;white-space:pre-wrap">${e.stack}</pre>`); }
}, 200));
</script>
</body></html>
