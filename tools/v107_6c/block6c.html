  const it = [['drill', `연수<small>경륜 · 금 ${fmt(Math.round(TR6C.drill * P))} · 능력 +1</small>`], ['mat', `물자 보급<small>강병 · 금 ${fmt(Math.round(TR6C.mat * P))} · 전선 군비 +${TR6C.matArm}</small>`], ['arb', `차익 위탁<small>상략 · 약 금 ${fmt(Math.round(trArbX(fid) * P))}어치</small>`],
    ['lux', `고가품 ${tier ? tier + '등급' : '잠김'}<small>교역도 ${TR6C.lux.join('/')} · 누구나</small>`], ['wel', `민생<small>덕화 · 금 ${fmt(Math.round(TR6C.wel * P))}+군량 ${fmt(TR6C.welFood)}</small>`], ['armz', `군량 군비화<small>덕화 · 군량 ${fmt(TR6C.armzFood)}+금 ${fmt(Math.round(TR6C.armzGold * P))}</small>`]];
  const n = trUnits(fid).length, pt = trFxCities(fid).reduce((s, c) => s + trPopTier(c), 0);
  const pas = [n && trOpen(fid, '병종') ? `특수 병종 ${n}개: 전선 도시 훈련 월 +${(TR6C.unitTrain * n).toFixed(2)} (상한 ${TR6C.unitCapBase + TR6C.unitCapPer * n})` : '', pt ? `덕화 인구 구간 ${pt}: 해당 도시 수입 +${Math.round(TR6C.popInc * 100)}%·민충 월 +${TR6C.popLoy}·인재 발견 (구간마다)` : '', o.traits ? `개성 학습 능력 보너스 ${o.traits}/${TR6C.traitMax}` : ''].filter(Boolean);
  return `<div class="kv">갈래 효과 (뿌리로 열림 · 교역 한도에서 지불)</div><div class="grid3">${it.map(([k, l]) => btn(l, 'trFx', k, { dis: !!trFxWhy(fid, k), s: 1 })).join('')}</div>${pas.length ? `<div class="dim sm">${pas.join(' · ')}</div>` : ''}`;
}
ACT.trFx = v => { const r = trFxDo(S.player, v); toast(r.msg, r.ok); if (r.ok) news(r.msg); renderSheet(); };
