<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>천하쟁패 v1.4 메인 화면 목업</title>
<style>
:root{--bg:#0f1428;--panel:#151c38;--card:#1c2547;--line:#2c3866;--text:#ece8dc;--muted:#aab2cf;--gold:#ffd75e;--gold2:#c9a24a;--tint:#f0a8b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Nanum Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-rows:30px 1fr;grid-template-columns:56px 1fr 260px;height:100vh;height:100dvh;min-width:640px;min-height:320px}
/* 상단 줄 */
#top{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 6px 0 10px;background:#0b1022;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden}
#top .date{font-weight:700;color:var(--gold);display:flex;align-items:center;gap:6px}
#top .fc{width:10px;height:10px;border-radius:2px;border:1px solid #fff}
#top .st{display:flex;align-items:center;gap:4px}
#top .st b{font-weight:600;color:var(--text)}
#top .st i{font-style:normal;color:var(--muted)}
#top .sp{flex:1}
#top .root{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;background:#2a2146;border:1px solid var(--gold);color:var(--gold);font-weight:700}
#top .pol{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;background:#1c2547;border:1px solid var(--line)}
#top .pol i{font-style:normal;color:var(--muted)}
#top .pol b{font-weight:600}
#top .pol b.own{color:var(--gold)}
#top .season{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;background:#1c2547;border:1px solid var(--line)}
#top .season .sw{width:10px;height:10px;border-radius:50%;background:var(--tint);border:1px solid #fff}
@media(max-width:760px){#top{gap:6px}#top .st.pr,#top .season,#top .pol i{display:none}}
#top .menu{width:34px;height:26px;border-radius:5px;border:1px solid var(--line);background:#1c2547;color:var(--text);font-size:15px}

.info .x{float:right;width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:#1c2547;color:var(--text);cursor:pointer}
.info h3{font-size:15px;color:var(--gold);margin-bottom:2px}
.info .tag{font-size:13px;color:var(--muted);margin-bottom:6px}
.info .row{font-size:13px;line-height:1.45;margin:5px 0}
.info .row b{display:block;color:var(--gold);font-size:12px;margin-bottom:1px}
.info .row.bad b{color:#e08a7a}
.info .row.good b{color:#8fd19a}
#top .root,#top .pol{cursor:pointer}
/* 왼쪽 레일 */
#rail{display:flex;flex-direction:column;background:#0b1022;border-right:1px solid var(--line)}
#rail button{flex:1;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:0;border-left:3px solid transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
#rail button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#rail button.on{color:var(--gold);background:#1a2246;border-left-color:var(--gold)}
/* 지도 */
#mapwrap{position:relative;overflow:hidden;touch-action:none;cursor:grab}
#map{display:block;width:100%;height:100%}
#seasonbar{position:absolute;left:6px;bottom:6px;display:flex;gap:3px;background:rgba(11,16,34,.86);border:1px solid var(--line);border-radius:6px;padding:3px}
#seasonbar button{min-width:30px;height:26px;padding:0 5px;border-radius:4px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
#seasonbar button.on{background:#2a3566;color:#fff}
#zoomui{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:3px}
#zoomui button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:rgba(11,16,34,.86);color:var(--text);font-size:17px;cursor:pointer}
/* 오른쪽 패널 */
#panel{display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#pscroll{flex:1;overflow-y:auto;min-height:0;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.card .h{display:flex;align-items:baseline;gap:6px}
.card .h .nm{font-size:16px;font-weight:700}
.card .h .ju{font-size:13px;color:var(--muted)}
.card .h .own{margin-left:auto;font-size:13px;display:flex;align-items:center;gap:4px}
.card .h .own i{width:9px;height:9px;border-radius:2px;border:1px solid #fff;display:inline-block}
.card .sub{font-size:13px;color:var(--muted);margin:2px 0 4px}
.card .sub b{color:var(--text);font-weight:600}
.card .g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;font-size:13px}
.card .g span{display:flex;justify-content:space-between}
.card .g i{font-style:normal;color:var(--muted)}
.tabt{font-size:13px;color:var(--gold);margin:8px 2px 4px;display:flex;justify-content:space-between}
.tabt i{font-style:normal;color:var(--muted)}
.cmd{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 8px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.cmd:hover{background:#1f2950;border-color:var(--line)}
.cmd .k{font-size:14px;font-weight:700;min-width:30px}
.cmd .d{font-size:13px;color:var(--muted);line-height:1.25;flex:1}
.cmd .c{font-size:12px;color:var(--gold2)}
#endturn{margin:6px 8px 8px;height:40px;border-radius:7px;border:0;background:var(--gold2);color:#1a1305;font:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
@media (max-width:720px){#top{gap:8px;font-size:13px}#top .st{gap:3px}}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <nav id="rail"></nav>
  <div id="mapwrap">
    <svg id="map"></svg>
    <div id="seasonbar"></div>
    <div id="zoomui"><button data-z="1.3">+</button><button data-z="0.77">−</button></div>
  </div>
  <aside id="panel"><div id="pscroll"></div><button id="endturn">이번 달 끝내기</button></aside>
</div>
<script>
const DATA=/*__DATA__*/null;
const {cities,roads,facs,rivers,coast,islands,inner,ranges,seasons,fix}=DATA;
const NS='http://www.w3.org/2000/svg';
const byName={};cities.forEach((c,i)=>{c.i=i;byName[c.n]=c;});
const facCol={},facT={};facs.forEach(f=>{facCol[f.r]=f.col;facT[f.r]=f.tcol;});
const capitals=new Set(facs.map(f=>f.home));
const PLAYER='조조';
let sel=byName['초'],tab='군사';
let season=new URLSearchParams(location.search).get('s');if(!seasons[season])season='spring';

// ---------- 보로노이 (반평면 교차, 변마다 이웃 번호를 붙여 세력 경계를 뽑는다) ----------
function clip(P,L,a,b,c,lab){
  const oP=[],oL=[],n=P.length;
  for(let i=0;i<n;i++){
    const p=P[i],q=P[(i+1)%n],dp=a*p[0]+b*p[1]-c,dq=a*q[0]+b*q[1]-c,ip=dp<=0,iq=dq<=0;
    const X=()=>{const t=dp/(dp-dq);return[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];};
    if(ip&&iq){oP.push(p);oL.push(L[i]);}
    else if(ip&&!iq){oP.push(p);oL.push(L[i]);oP.push(X());oL.push(lab);}
    else if(!ip&&iq){oP.push(X());oL.push(L[i]);}
  }
  return[oP,oL];
}
let cells,cellsT;
function voronoi(){
  const t0=performance.now();
  cells=cities.map((s,i)=>{
    let P=[[-10,-10],[1010,-10],[1010,1020],[-10,1020]],L=[-1,-1,-1,-1];
    const others=cities.map((o,j)=>[j,(o.x-s.x)**2+(o.y-s.y)**2]).filter(e=>e[0]!==i).sort((a,b)=>a[1]-b[1]);
    for(const[j]of others){const o=cities[j];[P,L]=clip(P,L,o.x-s.x,o.y-s.y,(o.x*o.x+o.y*o.y-s.x*s.x-s.y*s.y)/2,j);}
    return{P,L};
  });
  // v3: 영토용 셀 = 보로노이 다각형을 도시 중심 기준 방사 방향으로 최대 반경 R(가까운 이웃 3곳 평균 거리×1.2, 78~96)까지 끌어당긴다.
  //     같은 세력 이웃과의 공유 변은 끌어당기지 않고, 두 도시에서 같은 거리인 이등분선 위에서 max(Ri,Rj) 원으로만 자른다 → 양쪽이 같은 점을 내서 틈이 없다.
  //     변 표지: 이웃 번호(공유 변·반경 안 변) 또는 -2(끌어당긴 바깥 변).
  const Rr=cities.map((s,i)=>{const nd=cities.filter((_,j)=>j!==i).map(o=>Math.hypot(o.x-s.x,o.y-s.y)).sort((a,b)=>a-b).slice(0,3);return Math.max(78,Math.min(96,1.2*(nd[0]+nd[1]+nd[2])/3));});
  cellsT=cells.map((cl,i)=>{const s=cities[i],R=Rr[i],own=s.own,P=cl.P,L=cl.L,n=P.length,oP=[],oL=[];
    const dist=p=>Math.hypot(p[0]-s.x,p[1]-s.y);
    const pull=p=>{const d=dist(p);return d>R?[s.x+(p[0]-s.x)*R/d,s.y+(p[1]-s.y)*R/d]:p;};
    const disk=(p,q,r)=>{const dx=q[0]-p[0],dy=q[1]-p[1],fx=p[0]-s.x,fy=p[1]-s.y,A=dx*dx+dy*dy,B=2*(fx*dx+fy*dy),C=fx*fx+fy*fy-r*r,D=B*B-4*A*C;
      if(D<=0||!A)return null;const sq=Math.sqrt(D),t0=Math.max(0,(-B-sq)/(2*A)),t1=Math.min(1,(-B+sq)/(2*A));if(t1<=t0)return null;
      return[[p[0]+dx*t0,p[1]+dy*t0],[p[0]+dx*t1,p[1]+dy*t1]];};
    const push=(p,l)=>{const z=oP[oP.length-1];if(z&&Math.abs(z[0]-p[0])<0.05&&Math.abs(z[1]-p[1])<0.05){oL[oL.length-1]=l;return;}oP.push(p);oL.push(l);};
    for(let k=0;k<n;k++){const p=P[k],q=P[(k+1)%n],j=L[k];
      if(own&&j>=0&&cities[j].own===own){const sg=disk(p,q,Math.max(R,Rr[j]));if(sg){push(sg[0],j);push(sg[1],-2);}}
      else{const inside=dist(p)<=R&&dist(q)<=R;push(pull(p),inside?j:-2);}}
    // 끌어당긴 바깥 변이 너무 넓은 각(>50°)을 건너면 원 위 점을 45° 이하 간격으로 넣어 깊이 패이지 않게(각진 다각형은 유지)
    const fP=[],fL=[],m=oP.length;
    for(let k=0;k<m;k++){const a=oP[k],b=oP[(k+1)%m];fP.push(a);fL.push(oL[k]);
      if(oL[k]===-2&&dist(a)>R*0.98&&dist(b)>R*0.98){let a0=Math.atan2(a[1]-s.y,a[0]-s.x),a1=Math.atan2(b[1]-s.y,b[0]-s.x),da=a1-a0;
        while(da<=-Math.PI)da+=2*Math.PI;while(da>Math.PI)da-=2*Math.PI;const st=Math.ceil(Math.abs(da)/0.785);
        if(Math.abs(da)>0.87)for(let u=1;u<st;u++){const t=a0+da*u/st;fP.push([s.x+R*Math.cos(t),s.y+R*Math.sin(t)]);fL.push(-2);}}}
    return{P:fP,L:fL};});
  console.log('voronoi ms',(performance.now()-t0).toFixed(1));
}
voronoi();
const polyD=P=>'M'+P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z';
const landD=polyD(coast)+islands.map(polyD).join('');

// 강: Catmull-Rom → 베지어, 하류로 갈수록 굵게(구간별 굵기)
function riverSVG(){
  let s='';
  for(const r of rivers){const p=r.p,n=p.length-1;
    for(let i=0;i<n;i++){const w=r.w*(0.22+0.5*(i+1)/n);
      const seg=[p[Math.max(0,i-1)],p[i],p[i+1],p[Math.min(n,i+2)]];
      const d=`M${p[i]}C${p[i][0]+(seg[2][0]-seg[0][0])/6},${p[i][1]+(seg[2][1]-seg[0][1])/6} ${p[i+1][0]-(seg[3][0]-seg[1][0])/6},${p[i+1][1]-(seg[3][1]-seg[1][1])/6} ${p[i+1]}`;
      s+=`<path d="${d}" stroke-width="${w.toFixed(2)}"/>`;}
  }
  return s;
}
// 간단한 결정적 난수
const hash=(s,k=0)=>{let h=2166136261^k;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return((h>>>0)%10000)/10000;};
const terrColor=(c,S)=>c.t==='산악'||c.t==='관문'?S.mount:c.t==='남만'?S.south:c.t==='강변'||c.t==='나루'?S.river_land:S.plain;

// ---------- 정적 층(계절이 바뀔 때만 다시 만든다) ----------
const svg=document.getElementById('map');
let W=0,H=0,cam={x:620,y:470,k:0.72};{const q=new URLSearchParams(location.search);if(q.get('z'))cam.k=+q.get('z');if(q.get('cx'))cam.x=+q.get('cx');if(q.get('cy'))cam.y=+q.get('cy');}
function buildStatic(){
  const S=seasons[season];
  document.documentElement.style.setProperty('--tint',S.tint);
  let terr='',ridge='';
  cities.forEach((c,i)=>{terr+=`<path d="${polyD(cells[i].P)}" fill="${terrColor(c,S)}" stroke="${terrColor(c,S)}" stroke-width="2"/>`;
    if(c.t==='산악'||c.t==='관문'){for(let k=0;k<2;k++){const a=hash(c.n,k)*6.283,r=10+hash(c.n,k+9)*26,x=c.x+Math.cos(a)*r,y=c.y+Math.sin(a)*r,w=5+hash(c.n,k+5)*4;
      ridge+=`M${(x-w).toFixed(1)},${(y+w*0.5).toFixed(1)}L${x.toFixed(1)},${(y-w*0.45).toFixed(1)}L${(x+w).toFixed(1)},${(y+w*0.5).toFixed(1)}`;}}});
  // 영토: 세력마다 한 path, 그룹 투명도로 칠해 같은 세력 안 이음매가 안 보이게
  const by={};cities.forEach((c,i)=>{if(c.own&&cellsT[i].P.length)(by[c.own]=by[c.own]||[]).push(polyD(cellsT[i].P));});
  // v3: 영토 아래는 계절 틴트를 줄인 중립 땅(terr_base)을 깔고, 그 위에 지도용 진한 세력색(tcol)을 칠한다
  let territ='',allT='';for(const f in by){territ+=`<g opacity="${fix.terr_alpha}"><path d="${by[f].join('')}" fill="${facT[f]}" stroke="${facT[f]}" stroke-width="1"/></g>`;allT+=by[f].join('');}
  const tbase=`<g opacity="${fix.base_alpha}"><path d="${allT}" fill="${S.terr_base}" stroke="${S.terr_base}" stroke-width="1"/></g>`;
  // 경계: 주인 있는 셀에서, 다른 주인 이웃과 맞닿은 변 + 반경 상한 원 변
  let bord='';
  cellsT.forEach((cl,i)=>{const a=cities[i].own;if(!a)return;const n=cl.P.length;cl.L.forEach((j,k)=>{if(j>=0&&cities[j].own===a)return;
    const p=cl.P[k],q=cl.P[(k+1)%n];bord+=`M${p[0].toFixed(1)},${p[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}`;});});
  // 산맥: 부드러운 면 + 능선 + 짧은 결선
  let rng='',rdg='',tck='';
  for(const r of ranges){rng+=polyD(r.poly);rdg+='M'+r.ridge.map(p=>p.join(',')).join('L');for(const t of r.ticks)tck+=`M${t[0]},${t[1]}L${t[2]},${t[3]}`;}
  const outerRect='M-1500,-1500H2000V1500H-1500Z';
  let rd='',wd='';
  for(const r of roads){const a=byName[r.a],b=byName[r.b];if(!a||!b)continue;const s=`M${a.x},${a.y}L${b.x},${b.y}`;if(r.w)wd+=s;else rd+=s;}
  svg.innerHTML=`<defs><clipPath id="land"><path d="${landD}"/></clipPath><clipPath id="inner"><path d="${polyD(inner)}"/></clipPath><filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft2" x="-2%" y="-2%" width="104%" height="104%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="${S.tint}" stop-opacity="0"/><stop offset="1" stop-color="${S.tint}" stop-opacity=".42"/></radialGradient>
    <radialGradient id="fog" gradientUnits="userSpaceOnUse" cx="500" cy="505" r="1250"><stop offset=".56" stop-color="${S.fog}" stop-opacity="0"/><stop offset=".72" stop-color="${S.fog}" stop-opacity=".55"/><stop offset="1" stop-color="${S.fog}" stop-opacity="1"/></radialGradient></defs>
  <rect id="sea" x="0" y="0" width="100%" height="100%" fill="${S.fog}"/>
  <g id="world">
    <path d="${outerRect}" fill="${S.sea}"/>
    <path d="${landD}" fill="none" stroke="${S.band}" stroke-opacity=".28" stroke-width="30" stroke-linejoin="round"/>
    <path d="${landD}" fill="none" stroke="${S.band}" stroke-opacity=".5" stroke-width="12" stroke-linejoin="round"/>
    <path d="${landD}" fill="${S.plain}"/>
    <g clip-path="url(#land)"><g filter="url(#soft)">${terr}</g>
      <path d="${rng}" fill="${S.range}" stroke="${S.range}" stroke-width="9" stroke-linejoin="round" opacity=".9" filter="url(#soft2)"/>
      <g clip-path="url(#inner)">${tbase}</g>
      <path d="${outerRect}${polyD(inner)}" fill-rule="evenodd" fill="${S.offmap}" filter="url(#edge)"/>
      <g clip-path="url(#inner)">${territ}</g>
      <g pointer-events="none">${decor(S)}</g>
      <path d="${ridge}" fill="none" stroke="${S.ridge}" stroke-opacity=".5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${tck}" fill="none" stroke="${S.ridge}" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>
      <path d="${rdg}" fill="none" stroke="${S.ridge}" stroke-opacity=".9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g clip-path="url(#inner)"><path d="${bord}" fill="none" stroke="${fix.border}" stroke-opacity=".95" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g>
      <g fill="none" stroke="${fix.river}" stroke-linecap="round" stroke-opacity=".95">${riverSVG()}</g>
    </g>
    <path d="${landD}" fill="none" stroke="#2d3a48" stroke-opacity=".7" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    <path d="${rd}" fill="none" stroke="${fix.road}" stroke-width="1.3" stroke-dasharray="4 3" stroke-opacity=".9" vector-effect="non-scaling-stroke"/>
    <path d="${wd}" fill="none" stroke="${fix.water_case}" stroke-opacity=".9" stroke-width="3.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="${wd}" fill="none" stroke="${fix.water}" stroke-width="1.6" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>
    <g id="selroads"></g>
    <rect x="-1500" y="-1500" width="3500" height="3000" fill="url(#fog)" pointer-events="none"/>
  </g>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#vig)" pointer-events="none"/>
  <g id="scr"></g>`;
  buildSelRoads();camApply();
}
// v4: 계절 장식 (설·겨울 눈, 봄 꽃잎, 여름 반딧불, 가을 낙엽). 땅 위 결정적 위치, 아이콘·이름표는 화면 층이라 가려지지 않는다
function inPolyJ(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
function decor(S){const kind=S.ko;let o='';
  for(let n=0,placed=0;n<1600&&placed<260;n++){const x=hash('d'+n,1)*1000,y=hash('d'+n,2)*1010;if(!inPolyJ(x,y,coast)||!inPolyJ(x,y,inner))continue;
    if(cities.some(c=>Math.abs(c.x-x)<16&&Math.abs(c.y-y)<16))continue;placed++;const r=hash('d'+n,3),a=(hash('d'+n,4)*360).toFixed(0);

function buildSelRoads(){

// ---------- 화면 층: 거점 아이콘·이름표 (카메라가 바뀔 때마다) ----------
const SHIELD='M-10,-11H-6V-8H-2V-11H2V-8H6V-11H10V2Q10,8 0,12Q-10,8 -10,2Z';
const GATE='M-11,-10H11V-5H8V10H3V3Q3,-1 0,-1Q-3,-1 -3,3V10H-8V-5H-11Z';
const ANCHOR='M0,-6V7M-6,2Q0,10 6,2M-4,-2H4';
const CROWN='M-6,0L-7,-7L-3,-4L0,-9L3,-4L7,-7L6,0Z';
function prio(c){if(c===sel)return 0;if(!c.own)return 6;if(capitals.has(c.n))return 1;if(c.k==='도시'&&c.g===1)return 2;if(c.own===PLAYER)return 2;if(c.k==='도시'&&c.g===2)return 3;if(c.k==='도시')return 4;return 5;}
function toS(x,y){return[(x-cam.x)*cam.k+W/2,(y-cam.y)*cam.k+H/2];}
function drawScreen(){
  const k=cam.k,lim=k<0.55?2:k<1.15?4:9,f=Math.max(0.75,Math.min(1.25,0.7+0.45*k));
  const list=cities.map(c=>{const[sx,sy]=toS(c.x,c.y);return{c,sx,sy,p:prio(c)};}).filter(o=>o.sx>-30&&o.sx<W+30&&o.sy>-30&&o.sy<H+30);
  list.sort((a,b)=>a.p-b.p||a.c.g-b.c.g);
  let ic='',lb='';const occ=[];
  const hit=r=>occ.some(o=>r[0]<o[2]&&r[2]>o[0]&&r[1]<o[3]&&r[3]>o[1]);
  // 아이콘 (작은 것부터 그려 큰 것이 위로)
  const showMinor=k>=0.5;
  for(const o of [...list].reverse()){const c=o.c;
    if(c.k!=='도시'&&!showMinor&&o.p>0)continue;
    const col=c.own?facCol[c.own]:fix.free_fill,free=!c.own&&c!==sel;
    let s=c.k==='도시'?[0.95,0.8,0.66][c.g-1]:0.62;s*=f;if(free)s*=0.7;
    const tr=`translate(${o.sx.toFixed(1)},${o.sy.toFixed(1)}) scale(${s.toFixed(3)})`;
    if(c===sel)ic+=`<circle cx="${o.sx}" cy="${o.sy}" r="${(16*s+5).toFixed(1)}" fill="none" stroke="${fix.sel_case}" stroke-width="4.5"/><circle cx="${o.sx}" cy="${o.sy}" r="${(16*s+5).toFixed(1)}" fill="none" stroke="${fix.gold}" stroke-width="2.2"/>`;
    if(free){const d=c.k==='관문'?GATE:c.k==='나루'?null:SHIELD;
      ic+=`<g transform="${tr}" opacity="${fix.free_alpha}">`+(d?`<path d="${d}" fill="${col}" stroke="${fix.free_outer}" stroke-width="3.4" stroke-linejoin="round"/>`:`<circle r="10" fill="${col}" stroke="${fix.free_outer}" stroke-width="3.4"/><path d="${ANCHOR}" fill="none" stroke="${fix.free_outer}" stroke-width="2.2" stroke-linecap="round"/>`)+'</g>';}
    else if(c.k==='나루'){ic+=`<g transform="${tr}"><circle r="10" fill="${c.own?col:'#3d4b6a'}" stroke="${fix.icon_outer}" stroke-width="4"/><circle r="10" fill="none" stroke="#fff" stroke-width="1.6"/><path d="${ANCHOR}" fill="none" stroke="${c.own?'#10142a':'#fff'}" stroke-width="2" stroke-linecap="round"/><circle cy="-7.5" r="1.6" fill="none" stroke="${c.own?'#10142a':'#fff'}" stroke-width="1.4"/></g>`;}
    else{const d=c.k==='관문'?GATE:SHIELD;
      ic+=`<g transform="${tr}"><path d="${d}" fill="${col}" stroke="${fix.icon_outer}" stroke-width="4.2" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>`;
      if(c.k==='도시'&&c.g===1)ic+=`<rect x="-3" y="-3" width="6" height="6" fill="#10142a" opacity=".55"/>`;
      if(capitals.has(c.n))ic+=`<path d="${CROWN}" transform="${c.own===PLAYER||c===sel?'translate(0,-15)':'translate(0,-12.5) scale(.6)'}" fill="${fix.gold}" stroke="${fix.icon_outer}" stroke-width="1.6" stroke-linejoin="round"/>`;
      if(c.own===PLAYER)ic+=`<circle cx="11" cy="-10" r="3.6" fill="#3ddc6a" stroke="${fix.icon_outer}" stroke-width="1.6"/>`;
      ic+='</g>';}
    const r=(c.k==='도시'?12:10)*s;occ.push([o.sx-r,o.sy-r,o.sx+r,o.sy+r]);
  }
  // 이름표: 우선순위 순, 아래→오른쪽→위→왼쪽 중 빈 자리, 없으면 숨김
  for(const o of list){const c=o.c;if(o.p>lim)continue;if(c.k!=='도시'&&!showMinor)continue;
    const fs=c.k==='도시'?(c.g===1?13:12):11,w=c.n.length*fs+8,h=fs+6,r=(c.k==='도시'?12:10)*f*0.9;
    const cand=[[o.sx-w/2,o.sy+r+1],[o.sx+r+2,o.sy-h/2],[o.sx-w/2,o.sy-r-h-(capitals.has(c.n)?8:1)],[o.sx-r-2-w,o.sy-h/2]];
    let pos=null;for(const[x,y]of cand){const R=[x,y,x+w,y+h];if(o.p===0||!hit(R)){pos=R;break;}}
    if(!pos)continue;occ.push(pos);
    const isSel=c===sel;
    lb+=`<g><rect x="${pos[0].toFixed(1)}" y="${pos[1].toFixed(1)}" width="${w}" height="${h}" rx="4" fill="${fix.label_bg}"${isSel?` stroke="${fix.gold}" stroke-width="1.2"`:''}/><text x="${(pos[0]+w/2).toFixed(1)}" y="${(pos[1]+h/2+fs*0.36).toFixed(1)}" font-size="${fs}" font-weight="${c.g===1||isSel?700:500}" fill="${isSel?fix.gold:fix.label_text}" text-anchor="middle">${c.n}</text></g>`;
  }
  document.getElementById('scr').innerHTML=ic+lb;
}
function clampCam(){
  // v3: 아래 PADB px 은 계절 단추 막대 자리 — 지도 아래 끝이 막대 위에서 멈추게
  const PADB=40,kmin=Math.min(W/1020,(H-PADB)/1030)*0.98;cam.k=Math.max(kmin,Math.min(3,cam.k));
  const hw=W/2/cam.k,hh=H/2/cam.k,ylo=-10+hh,yhi=1020-(H/2-PADB)/cam.k;
  cam.x=hw*2>=1020?500:Math.max(-10+hw,Math.min(1010-hw,cam.x));
  cam.y=yhi<=ylo?(ylo+yhi)/2:Math.max(ylo,Math.min(yhi,cam.y));
}
let raf=0;
function camApply(){clampCam();const g=document.getElementById('world');if(g)g.setAttribute('transform',`translate(${(W/2-cam.x*cam.k).toFixed(2)},${(H/2-cam.y*cam.k).toFixed(2)}) scale(${cam.k.toFixed(4)})`);drawScreen();}
const req=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;camApply();});};
function zoomAt(f,px,py){const wx=(px-W/2)/cam.k+cam.x,wy=(py-H/2)/cam.k+cam.y;cam.k*=f;clampCam();cam.x=wx-(px-W/2)/cam.k;cam.y=wy-(py-H/2)/cam.k;req();}
function resize(){const r=svg.getBoundingClientRect();W=r.width;H=r.height;camApply();}

const wrap=document.getElementById('mapwrap'),pts=new Map();let moved=0,pinch0=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;wrap.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
  if(pts.size===2){const[a,b]=[...pts.values()];pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:cam.k};}});
wrap.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];
  if(pts.size===1){cam.x-=dx/cam.k;cam.y-=dy/cam.k;moved+=Math.abs(dx)+Math.abs(dy);req();}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&pinch0){const[a,b]=[...pts.values()],r=svg.getBoundingClientRect();const d=Math.hypot(a[0]-b[0],a[1]-b[1]);moved=99;
    zoomAt(pinch0.k*d/pinch0.d/cam.k,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);}});
const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size<2)pinch0=null;
  if(moved<6&&pts.size===0){const r=svg.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let best=null,bd=22;
    for(const c of cities){const[sx,sy]=toS(c.x,c.y),d=Math.hypot(sx-px,sy-py);if(d<bd){bd=d;best=c;}}
    if(best){sel=best;buildSelRoads();drawScreen();renderPanel();}}};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});

 정예주의:{r:'강병',g:'모든 도시 훈련 매달 +2(상한 120), 정예 출정비 절반, 전투력 +8%',b:'인구 80%까지만 뽑아 병력이 적음'},
 둔전제:{r:'덕화',g:'군량 +병사 유지분 50%, 개발·치수 비용 −20%, 먼 전선 보급 손실 없음',b:'상업이 덜 오름(−20%)'},
 '상업 진흥':{r:'상략',g:'금 수입 +15%, 보물 제작 비용 −30%',b:'군량 −병사 유지분 15%, 병사 유지비(금) +20%'},
 구현령:{r:'경륜',g:'해마다 도시 2곳당 1명 인재가 더 모임(잠재 +0.3성), 등용 성공 +15%p',b:'기존 장수 충성 해마다 −1'},
 '공신 우대':{r:'경륜',g:'기존 장수 충성 해마다 +3, 모반 위험 −15, 계승 혼란 1/4',b:'등용 성공 −5%p'},
 덕치:{r:'덕화',g:'민충 매달 +0.6, 다른 세력 백성이 더 넘어옴(+15%), 계승 혼란 조금 줄임',b:'산적을 못 막음'},
 법치:{r:'덕화',g:'산적 매달 −3, 모반 위험 −10, 정복지 민심 매달 +2, 금 수입 +5%',b:'백성 유입 −5%, 덕치와 함께 못 씀'}};
function showInfo(kind){const box=document.getElementById('pscroll');let h='';
  if(kind==='root'){const R=ROOT_INFO[ROOT];h=`<div class="card info"><button class="x" aria-label="닫기">✕</button><h3>뿌리 ${ROOT}</h3><div class="tag">${R.h} · 시작 때 정해 끝까지 간다</div>
   <div class="row"><b>통일하는 방법</b>${R.how}</div><div class="row"><b>열리는 교역·전용 장치</b>${R.open}<br>${R.own}</div>
   <div class="row good"><b>강점</b>${R.good}</div><div class="row bad"><b>약점</b>${R.bad}</div><div class="row"><b>${R.fit}</b></div></div>`;}
  else{h=`<div class="card info"><button class="x" aria-label="닫기">✕</button><h3>올해 국책</h3><div class="tag">매년 1월에 바꿀 수 있다 · ★ = 소속 뿌리(효과 100%), 그 외 60%</div>`+
   POLS.map(([n])=>{const P=POL_INFO[n],own=P.r===ROOT;return `<div class="row"><b>${n}${own?' ★':''} · 소속 ${P.r}${own?'':' (효과 60%)'}</b></div><div class="row good"><b>효익</b>${P.g}</div><div class="row bad"><b>대가</b>${P.b}</div>`;}).join('')+`</div>`;}
  box.innerHTML=h;box.scrollTop=0;box.querySelector('.x').onclick=renderPanel;}
function renderTop(){const S=seasons[season];
  document.getElementById('top').innerHTML=`<span class="date"><span class="fc" style="background:${facCol[PLAYER]}"></span>190년 ${S.mon}월 · ${PLAYER}</span>
  <span class="st"><i>금</i><b>12,480</b></span><span class="st"><i>군량</i><b>38,200</b></span><span class="st"><i>병력</i><b>52,300</b></span><span class="st pr"><i>물가</i><b>104%</b></span>
  <span class="sp"></span><span class="root" data-info="root" title="눌러서 설명 보기">뿌리 ${ROOT}</span><span class="pol" data-info="pol" title="눌러서 설명 보기"><i>국책</i>${POLS.map(p=>`<b class="${p[1]===ROOT?'own':''}">${p[0]}${p[1]===ROOT?'★':''}</b>`).join('·')}</span><span class="season"><span class="sw"></span>${S.ko}</span><button class="menu" aria-label="메뉴">☰</button>`;
  document.querySelectorAll('#top [data-info]').forEach(e=>e.onclick=()=>showInfo(e.dataset.info));}
function renderRail(){const r=document.getElementById('rail');r.innerHTML=Object.keys(CMDS).map(t=>`<button class="${t===tab?'on':''}" data-t="${t}"><svg viewBox="0 0 24 24">${ICON[t]}</svg>${t}</button>`).join('');
  r.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderRail();renderPanel();});}
function renderSeasonBar(){const b=document.getElementById('seasonbar');b.innerHTML=Object.entries(seasons).map(([k,S])=>`<button class="${k===season?'on':''}" data-s="${k}">${S.ko}</button>`).join('');
  b.querySelectorAll('button').forEach(x=>x.onclick=()=>{season=x.dataset.s;history.replaceState(null,'','?s='+season);renderSeasonBar();renderTop();buildStatic();});}
const GENS=['하후돈','하후연','조인','조홍','악진','이전'];
function renderPanel(){const c=sel,h=k=>hash(c.n,k);
  const n=v=>v.toLocaleString('ko-KR');
  const gold=n(Math.round(300+h(1)*2400)),food=n(Math.round(2000+h(2)*20000)),sol=n(Math.round((3+h(3)*25)*1000/(c.g||3)));
  const own=c.own?`<i style="background:${facCol[c.own]}"></i>${c.own}`:'<span style="color:var(--muted)">무주지</span>';
  const gov=c.own===PLAYER?GENS[Math.floor(h(4)*GENS.length)]:c.own?(capitals.has(c.n)?c.own:'—'):'없음';
  document.getElementById('pscroll').innerHTML=`<div class="card"><div class="h"><span class="nm">${c.n}</span><span class="ju">${c.ju} · ${c.k==='도시'?c.g+'등급':c.k} · ${c.t}</span><span class="own">${own}</span></div>
   <div class="sub">태수 <b>${c.n==='초'?'조조':gov}</b> · 장수 <b>${c.own?1+Math.floor(h(5)*6):0}</b>명</div>
   <div class="g"><span><i>금</i>${gold}</span><span><i>군량</i>${food}</span><span><i>병력</i>${sol}</span><span><i>민충</i>${Math.round(40+h(6)*55)}</span><span><i>농업</i>${Math.round(200+h(7)*700)}</span><span><i>상업</i>${Math.round(150+h(8)*700)}</span></div></div>
   <div class="tabt">${tab}<i>${c.own===PLAYER?'명령 가능':'아군 도시가 아님'}</i></div>
   ${CMDS[tab].map(([k,d,cost])=>`<div class="cmd"><span class="k">${k}</span><span class="d">${d}</span>${cost?`<span class="c">${cost}</span>`:''}</div>`).join('')}`;}
renderTop();renderRail();renderSeasonBar();renderPanel();
{const q=new URLSearchParams(location.search).get('info');if(q)showInfo(q);}
const r0=svg.getBoundingClientRect();W=r0.width;H=r0.height;
buildStatic();
</script>
</body>
</html>
